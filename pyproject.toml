[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "team2_mlops2026"
dynamic = ["version"]  # __version__ in team2_mlops2026/__init__.py
description = "Project for MLOps Course for the Master in Applied AI from Tec de Monterrey"
authors = [
  { name = "Team 2 MNA MLOps" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.0"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "integration: the pipeline end to end on synthetic data (deselect with -m \"not integration\")",
]
filterwarnings = [
    # Raised inside MLflow's SQLite tracking store, not by this project
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["team2_mlops2026"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 99
src = ["team2_mlops2026"]
include = ["pyproject.toml", "team2_mlops2026/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["team2_mlops2026"]
force-sort-within-sections = true

